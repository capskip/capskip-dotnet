name: Publish to NuGet

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub release
      id-token: write # required for NuGet Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack src/CapSkip/CapSkip.csproj --configuration Release --output artifacts

      # Trusted Publishing (OIDC): exchange the GitHub OIDC token for a short-lived
      # NuGet API key — no long-lived NUGET_API_KEY secret to store or rotate.
      # Requires a trusted publishing policy on nuget.org for this repo + workflow
      # (Repository Owner: capskip, Repository: capskip-dotnet, Workflow File: publish.yml).
      # 'user' is the nuget.org profile name that owns the trusted publishing policy.
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: capskip

      - name: Push to NuGet
        # --skip-duplicate makes a re-run of an already-published version a no-op.
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Without this the tag ships to NuGet but never appears on the repo's
      # Releases page. Notes are auto-generated from merged PRs and can be
      # edited afterwards.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: CapSkip .NET SDK ${{ github.ref_name }}
          generate_release_notes: true
